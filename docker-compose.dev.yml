# TextMirror 本地开发环境（macOS / Docker Desktop 适用）
# 与生产 docker-compose.yml 的区别：
#   - 自带 postgres / redis 容器，开箱即用
#   - 使用桥接网络 + 端口映射（host 网络模式在 macOS 上无效）
#   - 后端挂载源码并启用 uvicorn --reload 热更新
# 启动：docker compose -f docker-compose.dev.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: textmirror-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: textmirror
      POSTGRES_DB: textmirror
    ports:
      - "5432:5432"
    volumes:
      - textmirror-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d textmirror"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: textmirror-dev-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: textmirror-backend:dev
    container_name: textmirror-dev-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # 开发期放宽登录锁定，避免频繁测试登录被锁 15 分钟
      LOGIN_MAX_FAILURES: "10"
      LOGIN_LOCK_SECONDS: "60"
    ports:
      - "3020:3020"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 3020 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3020/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  celery-worker:
    build: ./backend
    image: textmirror-backend:dev
    container_name: textmirror-dev-celery
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app:celery_app worker --loglevel=info --pool=solo
    # 覆盖镜像内针对 API 服务的 healthcheck（celery 容器不跑 uvicorn）
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: textmirror-frontend:dev
    container_name: textmirror-dev-frontend
    restart: unless-stopped
    ports:
      - "3022:80"
    volumes:
      # 生产 nginx 配置代理到 127.0.0.1（仅 host 网络可用），开发环境改代理到 backend 服务名
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  textmirror-dev-pgdata:
