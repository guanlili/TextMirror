# TextMirror 本地开发 Nginx 配置（docker-compose.dev.yml 使用）
# 桥接网络下通过 compose 服务名访问后端
#
# 用 $remote_addr 覆盖转发头，不保留客户端伪造的 X-Forwarded-For。
# 开发网络里 Nginx 的源地址不是 127.0.0.1；要按浏览器区分客户端时，
# 把本容器 IP 加入后端 TRUSTED_PROXIES，不要写整段私网。
# 下面的 real_ip 与生产一致：只在对端是回环（同机 Traefik）时还原客户端。
# 开发编排没有 Traefik，端口映射进来的连接不会走这段。

# Traefik 源地址。默认按同机回环转发；改这里即可。
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the SPA entry after local frontend updates.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 多模型对比校对耗时较长（慢模型+重试可达数分钟），超时对齐后端 300s
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
}
