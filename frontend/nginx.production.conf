# TextMirror 生产环境 Nginx 配置（HTTP 模式，默认）
# 全 host 网络模式：nginx 直接监听宿主机端口 3022(HTTP)
# 后端代理到 127.0.0.1:3020（同在宿主机网络栈）
#
# 如需启用 HTTPS，请参考 nginx.production.ssl.conf
#
# 客户端 IP：公网网关把请求转到本 Nginx 时，TCP 对端是网关地址，
# 不能把 $remote_addr 直接当成用户。只信任下面的网关源，从 X-Forwarded-For
# 右侧还原真实客户端，再覆盖转发头。生产公网网关为 10.2.52.52；
# 网关后面的 NAT 地址（10.2.254.40）是客户端侧地址，不能加入信任列表。
# 不要写成 0.0.0.0/0。本文件与后端必须同一版本发布。

# 限流区域定义（http 上下文，server 外）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# 可信网关源地址；本机回环保留给同机代理/健康检查。
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.2.52.52;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 3022;
    server_name _;
    server_tokens off;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # 上传大小限制
    client_max_body_size 50m;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # SPA 入口：禁止缓存，确保部署后用户立即拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查端点
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
        access_log off;
    }

    # 登录接口限流（更严格）
    location ~ ^/api/v1/auth/(login|quick-login) {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API 反向代理（直接走 localhost，无需跨 Docker 网络）
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 静态资源缓存（单一 Cache-Control，避免 expires 与 add_header 重复下发）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # gzip 压缩（gzip_static 优先使用构建产物预压缩的 .gz）
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    keepalive_timeout 75s;
}
